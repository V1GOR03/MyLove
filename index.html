<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>موقعي</title>
<style>
body {
    background-color: #121212;
    color: #fff;
    font-family: Arial, sans-serif;
    margin:0; padding:0;
    overflow-x:hidden;
    position: relative;
}

/* القلوب الملونة عشوائية حقيقية */
.heart {
    position: absolute;
    width: 20px; height: 20px;
    background-color: red;
    clip-path: polygon(50% 0%, 61% 12%, 75% 12%, 88% 25%, 88% 38%, 75% 50%, 50% 75%, 25% 50%, 12% 38%, 12% 25%, 25% 12%, 39% 12%);
    animation: float 6s linear infinite;
    opacity: 0.8;
}
@keyframes float {
    0% { transform: translateY(0) rotate(0deg);}
    100% { transform: translateY(-1000px) rotate(360deg);}
}

/* أقسام الصور والنصوص */
.section {
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 50px 20px;
    flex-wrap: wrap;
    gap: 30px;
}
.section:nth-child(even) { flex-direction: row-reverse; }

.section img {
    width: 250px; height: 250px;
    object-fit: cover;
    transition: transform 0.3s;
    border-radius: 15px;
}
.section img:hover { transform: scale(1.1); }

/* فريم رفيع ملون لكل صورة */
.section img {
    border: 3px solid #ff4b5c;
    position: relative;
}

/* قلب صغير فوق الصورة */
.small-heart {
    position: absolute;
    width: 25px;
    height: 25px;
    background-color: #ff1744;
    clip-path: polygon(50% 0%, 61% 12%, 75% 12%, 88% 25%, 88% 38%, 75% 50%, 50% 75%, 25% 50%, 12% 38%, 12% 25%, 25% 12%, 39% 12%);
    animation: beat 1s infinite;
    top: 10px;
    right: 10px;
}

/* نبض القلب */
@keyframes beat {
    0%, 100% { transform: scale(1);}
    50% { transform: scale(1.3);}
}

/* النصوص بجانب الصور */
.section .text {
    max-width: 400px;
    background: rgba(255,75,92,0.1);
    padding: 20px;
    border-radius: 15px;
}

/* نص صغير منفصل */
.small-text {
    max-width: 600px;
    margin: 30px auto;
    padding: 15px;
    border: 2px solid #ff4b5c;
    border-radius: 15px;
    text-align: center;
    font-size: 16px;
}

/* زر الأغنية على شكل قلب */
.music-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 60px;
    height: 60px;
    background-color: #ff4b5c;
    clip-path: polygon(50% 0%, 61% 12%, 75% 12%, 88% 25%, 88% 38%, 75% 50%, 50% 75%, 25% 50%, 12% 38%, 12% 25%, 25% 12%, 39% 12%);
    cursor: pointer;
    display:flex; justify-content:center; align-items:center;
    transition: transform 0.3s, background-color 0.5s;
}
.music-btn.playing {
    animation: pulse 1s infinite;
    background-color: #ff1f3d;
    transform: scale(1.2);
}
@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.3); }
    100% { transform: scale(1); }
}

/* أزرار تفاعلية */
.buttons {
    display: flex;
    justify-content: center;
    margin: 30px 0;
    gap: 20px;
}
.buttons button {
    padding: 12px 25px;
    font-size: 16px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    background-color: #ff4b5c;
    color: #fff;
    transition: background-color 0.3s;
}
.buttons button:hover { background-color: #ff1f3d; }

.response {
    text-align: center;
    font-size: 18px;
    margin-top: 20px;
    display: none;
}
</style>
</head>
<body>

<div id="hearts"></div>

<!-- أقسام الصور والنصوص -->
<div class="section">
    <div style="position: relative;">
        <img src="images/photo1.jpg" alt="صورة 1">
        <div class="small-heart"></div>
    </div>
    <div class="text">نص 1 بجانب الصورة</div>
</div>
<div class="section">
    <div style="position: relative;">
        <img src="images/photo2.jpg" alt="صورة 2">
        <div class="small-heart"></div>
    </div>
    <div class="text">نص 2 بجانب الصورة</div>
</div>
<div class="section">
    <div style="position: relative;">
        <img src="images/photo3.jpg" alt="صورة 3">
        <div class="small-heart"></div>
    </div>
    <div class="text">نص 3 بجانب الصورة</div>
</div>

<!-- نص صغير منفصل -->
<div class="small-text">هذا النص الصغير مع فريم أسفل الصور</div>

<!-- أزرار تفاعلية -->
<div class="buttons">
    <button id="btn1">اختيار 1</button>
    <button id="btn2">اختيار 2</button>
</div>
<div class="response" id="response"></div>

<!-- زر الأغنية -->
<div class="music-btn" id="musicBtn"></div>
<audio id="song" src="Somewhere Only We Know.mp3"></audio>

<script>
const colors = ["#ff4b5c","#ffb400","#4cffd1","#6a5cff","#ff6a9f","#ff8f4b"];
const heartsContainer = document.getElementById('hearts');
for(let i=0;i<50;i++){
    let heart = document.createElement('div');
    heart.classList.add('heart');
    heart.style.backgroundColor = colors[Math.floor(Math.random()*colors.length)];
    heart.style.left = Math.random()*100+'vw';
    heart.style.top = Math.random()*100+'vh';
    heart.style.width = 15 + Math.random()*30+'px';
    heart.style.height = heart.style.width;
    heart.style.animationDuration = 5 + Math.random()*5 + 's';
    heartsContainer.appendChild(heart);
}

// زر الأغنية
const musicBtn = document.getElementById('musicBtn');
const song = document.getElementById('song');
musicBtn.addEventListener('click', ()=>{
    if(song.paused){
        song.play();
        musicBtn.classList.add('playing');
    } else {
        song.pause();
        musicBtn.classList.remove('playing');
    }
});

// الأزرار التفاعلية
const btn1 = document.getElementById('btn1');
const btn2 = document.getElementById('btn2');
const response = document.getElementById('response');
btn1.addEventListener('click', ()=>{
    response.textContent = "لقد اخترت الاختيار 1";
    response.style.display = "block";
    btn2.style.display = "none";
});
btn2.addEventListener('click', ()=>{
    response.textContent = "لقد اخترت الاختيار 2";
    response.style.display = "block";
    btn1.style.display = "none";
});
</script>
</body>
</html>
