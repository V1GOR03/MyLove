<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For My Love 💖</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #fff;
      color: #444;
      text-align: center;
      background-image: url('https://i.imgur.com/4NJlK2y.png'); /* خلفية ورد */
      background-size: cover;
      background-attachment: fixed;
    }

    header {
      padding: 30px;
      background: rgba(255, 192, 203, 0.8);
      border-bottom: 3px solid #ff69b4;
    }

    header h1 {
      font-size: 2.5rem;
      color: #ff1493;
    }

    header p {
      color: #660066;
      font-size: 1.2rem;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      padding: 30px;
    }

    .photo-card {
      background: rgba(255, 255, 255, 0.9);
      border: 2px solid #ffb6c1;
      border-radius: 20px;
      padding: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: transform 0.3s;
    }

    .photo-card:hover {
      transform: scale(1.05);
    }

    .photo-card img {
      max-width: 100%;
      border-radius: 15px;
    }

    .photo-card p {
      margin-top: 10px;
      font-size: 1rem;
      color: #d63384;
    }

    /* زر القلب (لتشغيل الأغنية) */
    #music-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #ff69b4;
      color: white;
      border: none;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      font-size: 24px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      transition: background 0.3s;
    }

    #music-btn.active {
      background: #d63384;
    }

    /* أزرار القلوب للنهاية */
    .love-buttons {
      margin: 30px;
    }

    .love-btn {
      background: #ffb6c1;
      border: none;
      border-radius: 50px;
      padding: 12px 20px;
      margin: 10px;
      font-size: 18px;
      cursor: pointer;
      color: white;
      transition: background 0.3s;
    }

    .love-btn:hover {
      background: #ff69b4;
    }

    .response {
      margin-top: 10px;
      font-size: 1.1rem;
      color: #660066;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <h1>For My Love 💖</h1>
    <p>Just a little gift made with love</p>
  </header>

  <!-- الصور (9 صور) -->
  <section class="gallery">
    <div class="photo-card">
      <img src="https://via.placeholder.com/250x200" alt="Photo 1">
      <p>كلمة جنب الصورة</p>
    </div>
    <div class="photo-card">
      <img src="https://via.placeholder.com/250x200" alt="Photo 2">
      <p>كلمة جنب الصورة</p>
    </div>
    <div class="photo-card">
      <img src="https://via.placeholder.com/250x200" alt="Photo 3">
      <p>كلمة جنب الصورة</p>
    </div>
    <div class="photo-card">
      <img src="https://via.placeholder.com/250x200" alt="Photo 4">
      <p>كلمة جنب الصورة</p>
    </div>
    <div class="photo-card">
      <img src="https://via.placeholder.com/250x200" alt="Photo 5">
      <p>كلمة جنب الصورة</p>
    </div>
    <div class="photo-card">
      <img src="https://via.placeholder.com/250x200" alt="Photo 6">
      <p>كلمة جنب الصورة</p>
    </div>
    <div class="photo-card">
      <img src="https://via.placeholder.com/250x200" alt="Photo 7">
      <p>كلمة جنب الصورة</p>
    </div>
    <div class="photo-card">
      <img src="https://via.placeholder.com/250x200" alt="Photo 8">
      <p>كلمة جنب الصورة</p>
    </div>
    <div class="photo-card">
      <img src="https://via.placeholder.com/250x200" alt="Photo 9">
      <p>كلمة جنب الصورة</p>
    </div>
  </section>

  <!-- أزرار القلوب -->
  <section class="love-buttons">
    <button class="love-btn" onclick="showResponse('r1')">❤️ Button 1</button>
    <div id="r1" class="response"></div>

    <button class="love-btn" onclick="showResponse('r2')">💜 Button 2</button>
    <div id="r2" class="response"></div>
  </section>

  <!-- زر تشغيل الأغنية -->
  <button id="music-btn" onclick="toggleSong()">💖</button>
  <audio id="mySong" loop>
    <source src="Somewhere Only We Know.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <script>
    function toggleSong() {
      let song = document.getElementById("mySong");
      let btn = document.getElementById("music-btn");
      if (song.paused) {
        song.play();
        btn.classList.add("active");
      } else {
        song.pause();
        btn.classList.remove("active");
      }
    }

    function showResponse(id) {
      let div = document.getElementById(id);
      if (id === "r1") {
        div.innerHTML = "🌹 هذا الرد للأول";
      } else if (id === "r2") {
        div.innerHTML = "💌 هذا الرد للثاني";
      }
    }
  </script>
</body>
</html>
