<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقعي</title>
    <style>
        body {
            background-color: #121212;
            color: #fff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* قلوب متحركة */
        .heart {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: red;
            clip-path: polygon(50% 0%, 61% 8%, 68% 23%, 68% 38%, 50% 60%, 32% 38%, 32% 23%, 39% 8%);
            animation: float 10s infinite;
            opacity: 0.7;
        }

        @keyframes float {
            0% { transform: translateY(100vh) scale(1); }
            50% { transform: translateY(50vh) scale(1.2); }
            100% { transform: translateY(-10vh) scale(1); }
        }

        /* معرض الصور */
        .gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            padding: 50px 20px;
            justify-content: center;
        }

        .gallery img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 15px;
            transition: transform 0.3s;
        }

        .gallery img:hover { transform: scale(1.1); }

        /* قسم النصوص */
        .content {
            text-align: center;
            padding: 30px 20px;
        }

        .content h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .content p {
            font-size: 18px;
            line-height: 1.6;
            max-width: 800px;
            margin: 10px auto;
        }

        /* قسم الأغنية */
        .music {
            text-align: center;
            padding: 30px 20px;
        }

        .music button {
            background-color: #ff4b5c;
            color: #fff;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .music button:hover { background-color: #ff1f3d; }
    </style>
</head>
<body>

    <!-- قلوب -->
    <div id="hearts"></div>

    <!-- النصوص -->
    <div class="content">
        <h1>عنوانك هنا</h1>
        <p>النص أو الفقرة الأولى توضع هنا. يمكنك تعديلها كما تريد.</p>
        <p>النص أو الفقرة الثانية توضع هنا.</p>
    </div>

    <!-- معرض الصور -->
    <div class="gallery" id="gallery">
        <!-- أضف صورك المحلية هنا -->
        <img src="images/photo1.jpg" alt="صورة 1">
        <img src="images/photo2.jpg" alt="صورة 2">
        <img src="images/photo3.jpg" alt="صورة 3">
        <img src="images/photo4.jpg" alt="صورة 4">
        <img src="images/photo5.jpg" alt="صورة 5">
        <img src="images/photo6.jpg" alt="صورة 6">
        <img src="images/photo7.jpg" alt="صورة 7">
        <img src="images/photo8.jpg" alt="صورة 8">
        <img src="images/photo9.jpg" alt="صورة 9">
    </div>

    <!-- تشغيل الأغنية -->
    <div class="music">
        <audio id="song" src="Somewhere Only We Know.mp3"></audio>
        <button id="playBtn">تشغيل الأغنية</button>
    </div>

    <script>
        // إنشاء قلوب عشوائية
        const heartsContainer = document.getElementById('hearts');
        for(let i=0; i<30; i++){
            let heart = document.createElement('div');
            heart.classList.add('heart');
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = 5 + Math.random() * 5 + 's';
            heart.style.width = 15 + Math.random() * 25 + 'px';
            heart.style.height = heart.style.width;
            heartsContainer.appendChild(heart);
        }

        // زر الأغنية
        const song = document.getElementById('song');
        const playBtn = document.getElementById('playBtn');
        playBtn.addEventListener('click', () => {
            if(song.paused){
                song.play();
                playBtn.textContent = "إيقاف الأغنية";
            } else {
                song.pause();
                playBtn.textContent = "تشغيل الأغنية";
            }
        });
    </script>
</body>
</html>
