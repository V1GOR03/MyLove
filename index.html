<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Love Website</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #1c1c1c url('https://i.imgur.com/xVXn7Da.png') repeat; /* خلفية ورود وقلوب */
      color: #fff;
      text-align: center;
    }

    .container {
      width: 90%;
      margin: auto;
      padding-top: 50px;
    }

    .photo-card {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 15px;
      margin: 40px 0;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(255, 105, 180, 0.3);
      transform: rotate(-2deg);
      animation: fadeIn 1s ease-in-out forwards;
      opacity: 0;
    }

    .photo-card:nth-child(even) {
      transform: rotate(2deg);
    }

    .photo-card img {
      max-width: 200px;
      border-radius: 15px;
      border: 3px solid pink;
      margin-bottom: 15px;
    }

    .text-box {
      background: rgba(255, 255, 255, 0.1);
      padding: 15px;
      border-radius: 10px;
      text-align: left;
      line-height: 1.6;
      font-size: 16px;
    }

    /* زر القلب */
    .heart-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #ff4d6d;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 77, 109, 0.5);
      transition: background 0.3s;
    }

    .heart-btn.active {
      background: #ff85a2;
    }

    .heart-btn::before {
      content: "❤";
      font-size: 24px;
      color: white;
    }

    /* أزرار الخيارات */
    .choices {
      margin: 30px 0;
    }

    .choices button {
      background: #ff4d6d;
      border: none;
      color: white;
      padding: 12px 25px;
      margin: 10px;
      border-radius: 25px;
      cursor: pointer;
      transition: transform 0.2s, background 0.3s;
    }

    .choices button:hover {
      transform: scale(1.1);
      background: #ff85a2;
    }

    .response {
      display: none;
      margin-top: 15px;
      font-size: 18px;
      animation: fadeIn 1s ease-in-out;
    }

    /* أنيميشن */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>My Love 💖</h1>

    <!-- صور + كتابة -->
    <div class="photo-card"><img src="https://via.placeholder.com/200"><div class="text-box">Your text here...</div></div>
    <div class="photo-card"><img src="https://via.placeholder.com/200"><div class="text-box">Your text here...</div></div>
    <div class="photo-card"><img src="https://via.placeholder.com/200"><div class="text-box">Your text here...</div></div>
    <div class="photo-card"><img src="https://via.placeholder.com/200"><div class="text-box">Your text here...</div></div>
    <div class="photo-card"><img src="https://via.placeholder.com/200"><div class="text-box">Your text here...</div></div>
    <div class="photo-card"><img src="https://via.placeholder.com/200"><div class="text-box">Your text here...</div></div>
    <div class="photo-card"><img src="https://via.placeholder.com/200"><div class="text-box">Your text here...</div></div>
    <div class="photo-card"><img src="https://via.placeholder.com/200"><div class="text-box">Your text here...</div></div>
    <div class="photo-card"><img src="https://via.placeholder.com/200"><div class="text-box">Your text here...</div></div>

    <!-- أزرار خيارات -->
    <div class="choices">
      <button onclick="showResponse('Yes')">Yes 💕</button>
      <button onclick="showResponse('No')">No 💔</button>
    </div>
    <div id="response" class="response"></div>
  </div>

  <!-- زر الأغنية -->
  <div class="heart-btn" onclick="toggleMusic()"></div>
  <audio id="bg-music" src="Somewhere Only We Know.mp3"></audio>

  <script>
    // تشغيل/إيقاف الأغنية
    function toggleMusic() {
      const music = document.getElementById("bg-music");
      const heartBtn = document.querySelector(".heart-btn");
      if (music.paused) {
        music.play();
        heartBtn.classList.add("active");
      } else {
        music.pause();
        heartBtn.classList.remove("active");
      }
    }

    // إظهار الرد + إرساله لتيلجرام
    function showResponse(choice) {
      const responseDiv = document.getElementById("response");
      responseDiv.innerHTML = "You chose: " + choice;
      responseDiv.style.display = "block";

      // إرسال الرد لتيلجرام
      const botToken = "YOUR_BOT_TOKEN";
      const chatId = "YOUR_CHAT_ID";
      const url = `https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent("Choice: " + choice)}`;
      fetch(url);
    }

    // أنيميشن عند التمرير
    const cards = document.querySelectorAll('.photo-card');
    window.addEventListener('scroll', () => {
      cards.forEach(card => {
        const rect = card.getBoundingClientRect();
        if (rect.top < window.innerHeight - 100) {
          card.style.opacity = "1";
        }
      });
    });
  </script>
</body>
</html>
