<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>موقعي</title>
<style>
body {
    background-color: #121212;
    color: #fff;
    font-family: Arial, sans-serif;
    margin:0; padding:0;
    overflow-x:hidden;
    position: relative;
}

/* القلوب الصغيرة الملونة بنفس شكل زر الأغنية */
.heart {
    position: absolute;
    width: 15px;
    height: 15px;
    background-color: red;
    transform: rotate(-45deg);
    animation: float 10s linear infinite;
    opacity: 0.8;
}
.heart::before,
.heart::after {
    content: "";
    position: absolute;
    width: 15px;
    height: 15px;
    background-color: inherit;
    border-radius: 50%;
}
.heart::before { top: -7.5px; left: 0; }
.heart::after { left: 7.5px; top: 0; }

@keyframes float {
    0% { transform: translateY(-10%) rotate(-45deg) scale(1); }
    50% { transform: translateY(50%) rotate(-45deg) scale(1.2); }
    100% { transform: translateY(110%) rotate(-45deg) scale(1); }
}

/* أقسام الصور والنصوص */
.section {
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 50px 20px;
    flex-wrap: wrap;
    gap: 30px;
}
.section:nth-child(even) { flex-direction: row-reverse; }

.section img {
    width: 250px; height: 250px;
    object-fit: cover;
    transition: transform 0.3s;
}
.section img:hover { transform: scale(1.1); }

/* فريمات مختلفة لكل صورة */
.section:nth-child(1) img { border: 5px solid #ff4b5c; border-radius: 20px; }
.section:nth-child(2) img { border: 5px dashed #ffb400; border-radius: 50%; }
.section:nth-child(3) img { border: 5px double #4cffd1; border-radius: 10px; }
.section:nth-child(4) img { border: 5px dotted #6a5cff; border-radius: 30px; }
.section:nth-child(5) img { border: 5px solid #ff6a9f; border-radius: 5px; box-shadow: 0 0 20px #ff6a9f; }
.section:nth-child(6) img { border: 5px solid #ff8f4b; border-radius: 25px; }
.section:nth-child(7) img { border: 5px solid #ff4b5c; border-radius: 15px; box-shadow: 0 0 15px #ff4b5c; }
.section:nth-child(8) img { border: 5px dashed #ffb400; border-radius: 50%; }
.section:nth-child(9) img { border: 5px double #4cffd1; border-radius: 20px; }

/* النصوص بجانب الصور */
.section .text {
    max-width: 400px;
    background: rgba(255,75,92,0.1);
    padding: 20px;
    border-radius: 15px;
}

/* نص صغير منفصل */
.small-text {
    max-width: 600px;
    margin: 30px auto;
    padding: 15px;
    border: 2px solid #ff4b5c;
    border-radius: 15px;
    text-align: center;
    font-size: 16px;
}

/* زر الأغنية على شكل قلب أصغر */
.music-btn {
    width: 40px;
    height: 40px;
    background-color: #ff4b5c;
    position: fixed;
    bottom: 20px;
    right: 20px;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    transform: rotate(-45deg);
    transition: transform 0.3s, background-color 0.5s;
}
.music-btn::before,
.music-btn::after {
    content: "";
    position: absolute;
    width: 40px;
    height: 40px;
    background-color: inherit;
    border-radius: 50%;
}
.music-btn::before { top: -20px; left: 0; }
.music-btn::after { left: 20px; top: 0; }
.music-btn.playing { animation: pulse 1s infinite; background-color: #ff1f3d; transform: rotate(-45deg) scale(1.2); }

@keyframes pulse {
    0% { transform: rotate(-45deg) scale(1); }
    50% { transform: rotate(-45deg) scale(1.3); }
    100% { transform: rotate(-45deg) scale(1); }
}

/* أزرار تفاعلية */
.buttons {
    display: flex;
    justify-content: center;
    margin: 30px 0;
    gap: 20px;
}
.buttons button {
    padding: 12px 25px;
    font-size: 16px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    background-color: #ff4b5c;
    color: #fff;
    transition: background-color 0.3s;
}
.buttons button:hover { background-color: #ff1f3d; }

.response {
    text-align: center;
    font-size: 18px;
    margin-top: 20px;
    display: none;
}
</style>
</head>
<body>

<div id="hearts"></div>

<!-- أقسام الصور والنصوص -->
<div class="section">
    <img src="images/photo1.jpg" alt="صورة 1">
    <div class="text">نص 1 بجانب الصورة</div>
</div>
<div class="section">
    <img src="images/photo2.jpg" alt="صورة 2">
    <div class="text">نص 2 بجانب الصورة</div>
</div>
<div class="section">
    <img src="images/photo3.jpg" alt="صورة 3">
    <div class="text">نص 3 بجانب الصورة</div>
</div>
<div class="section">
    <img src="images/photo4.jpg" alt="صورة 4">
    <div class="text">نص 4 بجانب الصورة</div>
</div>
<div class="section">
    <img src="images/photo5.jpg" alt="صورة 5">
    <div class="text">نص 5 بجانب الصورة</div>
</div>
<div class="section">
    <img src="images/photo6.jpg" alt="صورة 6">
    <div class="text">نص 6 بجانب الصورة</div>
</div>
<div class="section">
    <img src="images/photo7.jpg" alt="صورة 7">
    <div class="text">نص 7 بجانب الصورة</div>
</div>
<div class="section">
    <img src="images/photo8.jpg" alt="صورة 8">
    <div class="text">نص 8 بجانب الصورة</div>
</div>
<div class="section">
    <img src="images/photo9.jpg" alt="صورة 9">
    <div class="text">نص 9 بجانب الصورة</div>
</div>

<!-- نص صغير منفصل -->
<div class="small-text">هذا النص الصغير مع فريم أسفل الصور</div>

<!-- أزرار تفاعلية -->
<div class="buttons">
    <button id="btn1">اختيار 1</button>
    <button id="btn2">اختيار 2</button>
</div>
<div class="response" id="response"></div>

<!-- زر الأغنية -->
<div class="music-btn" id="musicBtn"></div>
<audio id="song" src="music/song.mp3"></audio>

<script>
const colors = ["#ff4b5c","#ffb400","#4cffd1","#6a5cff","#ff6a9f","#ff8f4b"];
const heartsContainer = document.getElementById('hearts');
let heartsArray = [];

function createHearts() {
    for(let i=0;i<50;i++){
        let heart = document.createElement('div');
        heart.classList.add('heart');
        heart.style.backgroundColor = colors[Math.floor(Math.random()*colors.length)];
        heart.style.left = Math.random()*100+'vw';
        heart.style.top = Math.random()*100+'vh';
        heart.style.width = 10 + Math.random()*15+'px';
        heart.style.height = heart.style.width;
        heart.style.animationDuration = 5 + Math.random()*5 + 's';
        heartsContainer.appendChild(heart);
        heartsArray.push(heart);
    }
}

// إنشاء القلوب لكنها مخفية في البداية
createHearts();
heartsArray.forEach(h => h.style.display = "none");

// زر الأغنية
const musicBtn = document.getElementById('musicBtn');
const song = document.getElementById('song');
musicBtn.addEventListener('click', ()=>{
    if(song.paused){
        song.play();
        musicBtn.classList.add('playing');
        heartsArray.forEach(h => h.style.display = "block");
    } else {
        song.pause();
        musicBtn.classList.remove('playing');
        heartsArray.forEach(h => h.style.display = "none");
    }
});

// الأزرار التفاعلية
const btn1 = document.getElementById('btn1');
const btn2 = document.getElementById('btn2');
const response = document.getElementById('response');
btn1.addEventListener('click', ()=>{
    response.textContent = "لقد اخترت الاختيار 1";
    response.style.display = "block";
    btn2.style.display = "none";
});
btn2.addEventListener('click', ()=>{
    response.textContent = "لقد اخترت الاختيار 2";
    response.style.display = "block";
    btn1.style.display = "none";
});
</script>
</body>
</html>
