<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صفحة القلوب والورود</title>
  <style>
    body {
      background: pink;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    /* الخلفية المتحركة */
    .emoji-bg {
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0; left: 0;
      overflow: hidden;
      z-index: -1;
    }
    .emoji {
      position: absolute;
      font-size: 24px;
      animation: floatUp 10s linear infinite;
      opacity: 0.7;
    }
    @keyframes floatUp {
      0% { transform: translateY(100vh); opacity: 1; }
      100% { transform: translateY(-10vh); opacity: 0; }
    }

    /* شبكة الصور */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      text-align: center;
      transition: transform 0.3s;
    }
    .card:hover {
      transform: scale(1.05);
    }
    .card img {
      width: 100%;
      height: 200px; /* كل الصور نفس الطول */
      object-fit: cover; /* يملأ الإطار بدون قص أو تمدد غير مناسب */
    }
    .card p {
      padding: 10px;
    }

    /* الأزرار */
    .buttons {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      gap: 15px;
      z-index: 10;
    }
    .btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      transition: transform 0.3s;
    }
    .btn:hover {
      transform: scale(1.2);
    }
    #musicBtn { background: #ff4d6d; color: white; }
    #heartBtn { background: #ffd6e0; }
  </style>
</head>
<body>
  <div class="emoji-bg" id="emojiBg"></div>

  <!-- الصور -->
  <div class="gallery">
    <div class="card"><img src="images/p1.jpg"><p>نص الصورة 1</p></div>
    <div class="card"><img src="images/p2.jpg"><p>نص الصورة 2</p></div>
    <div class="card"><img src="images/p3.jpg"><p>نص الصورة 3</p></div>
    <div class="card"><img src="images/p4.jpg"><p>نص الصورة 4</p></div>
    <div class="card"><img src="images/p5.jpg"><p>نص الصورة 5</p></div>
    <div class="card"><img src="images/p6.jpg"><p>نص الصورة 6</p></div>
    <div class="card"><img src="images/p7.jpg"><p>نص الصورة 7</p></div>
    <div class="card"><img src="images/p8.jpg"><p>نص الصورة 8</p></div>
    <div class="card"><img src="images/p9.jpg"><p>نص الصورة 9</p></div>
  </div>

  <!-- الأزرار -->
  <div class="buttons">
    <button id="musicBtn" class="btn">❤️</button>
    <button id="heartBtn" class="btn">💖</button>
  </div>

  <audio id="song" src="Somewhere Only We Know.mp3"></audio>

  <script>
    // زر الأغنية
    const musicBtn = document.getElementById('musicBtn');
    const song = document.getElementById('song');
    musicBtn.addEventListener('click', () => {
      if(song.paused){
        song.play();
        musicBtn.textContent = "⏸️";
      } else {
        song.pause();
        musicBtn.textContent = "❤️";
      }
    });

    // زر القلوب
    const heartBtn = document.getElementById('heartBtn');
    const emojis = ["🩵","💙","🩷","💛","💖","💕","🤍","🖤","🌷","🌹","🪷","🌸","💗","💓","💞","🧡","💚","💜"];
    heartBtn.addEventListener('click', () => {
      for(let i=0; i<50; i++){
        const emoji = document.createElement('div');
        emoji.classList.add('emoji');
        emoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        emoji.style.left = Math.random() * window.innerWidth + "px";
        emoji.style.top = Math.random() * window.innerHeight + "px";
        emoji.style.fontSize = (20 + Math.random() * 40) + "px";
        document.body.appendChild(emoji);
        setTimeout(() => { emoji.remove(); }, 3000);
      }
    });
  </script>
</body>
</html>
