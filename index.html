<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>قلوب وزهور</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: pink;
      overflow-x: hidden;
      font-family: Arial, sans-serif;
    }

    /* العناصر المتحركة بالخلفية */
    .background-item {
      position: absolute;
      opacity: 0.6;
      animation: float 10s linear infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes float {
      0% { transform: translateY(-10%) scale(1); }
      50% { transform: translateY(50%) scale(1.2); }
      100% { transform: translateY(110%) scale(1); }
    }

    /* الصور والنصوص */
    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      padding: 80px 20px;
      z-index: 1;
      position: relative;
    }

    .gallery-item {
      background: #fff;
      border-radius: 15px;
      padding: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      text-align: center;
    }

    .gallery-item img {
      width: 100%;
      border-radius: 15px;
    }

    /* الأزرار */
    .controls {
      position: fixed;
      top: 15px;
      right: 15px;
      display: flex;
      gap: 10px;
      z-index: 1000;
    }

    button {
      padding: 10px 15px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      transition: 0.3s;
    }

    #musicBtn {
      background: #ff4b5c;
      color: white;
    }

    #emojiBtn {
      background: beige;
      color: black;
    }

    button:hover {
      transform: scale(1.1);
    }

    /* الإيموجيات */
    .emoji {
      position: fixed;
      font-size: 2.2rem;
      z-index: 999;
      animation: fly 3s forwards;
      pointer-events: none;
    }

    @keyframes fly {
      0% { opacity: 1; transform: translate(0,0) scale(1); }
      100% { opacity: 0; transform: translate(var(--x), var(--y)) scale(2); }
    }
  </style>
</head>
<body>
  <!-- الأزرار -->
  <div class="controls">
    <button id="musicBtn">🎵</button>
    <button id="emojiBtn">💖</button>
  </div>

  <!-- الصوت -->
  <audio id="song" src="your-song.mp3"></audio>

  <!-- الصور -->
  <div class="gallery">
    <div class="gallery-item"><img src="images/ph1.jpg"><p>نص الصورة 1</p></div>
    <div class="gallery-item"><img src="images/ph2.jpg"><p>نص الصورة 2</p></div>
    <div class="gallery-item"><img src="images/ph3.jpg"><p>نص الصورة 3</p></div>
    <div class="gallery-item"><img src="images/ph4.jpg"><p>نص الصورة 4</p></div>
    <div class="gallery-item"><img src="images/ph5.jpg"><p>نص الصورة 5</p></div>
    <div class="gallery-item"><img src="images/ph6.jpg"><p>نص الصورة 6</p></div>
    <div class="gallery-item"><img src="images/ph7.jpg"><p>نص الصورة 7</p></div>
    <div class="gallery-item"><img src="images/ph8.jpg"><p>نص الصورة 8</p></div>
    <div class="gallery-item"><img src="images/ph9.jpg"><p>نص الصورة 9</p></div>
  </div>

  <script>
    // الخلفية المتحركة
    const emojisBg = ["🩵","💙","🩷","💛","💖","💕","🤍","🖤","🌷","🌹","🪷","🌸","💗","💓","💞","🩷","🧡","💛","💚","💙","🩵","💜","🤍","🖤"];
    for (let i = 0; i < 40; i++) {
      let item = document.createElement("div");
      item.classList.add("background-item");
      item.textContent = emojisBg[Math.floor(Math.random()*emojisBg.length)];
      item.style.left = Math.random()*100 + "vw";
      item.style.top = Math.random()*100 + "vh";
      item.style.fontSize = (20 + Math.random()*40) + "px";
      item.style.animationDuration = (8 + Math.random()*8) + "s";
      document.body.appendChild(item);
    }

    // زر الأغنية
    const musicBtn = document.getElementById("musicBtn");
    const song = document.getElementById("song");
    musicBtn.addEventListener("click", () => {
      if(song.paused){
        song.play();
      } else {
        song.pause();
      }
    });

    // زر القلوب (يطلع 50 مرة كل كبسة)
    const emojiBtn = document.getElementById("emojiBtn");
    emojiBtn.addEventListener("click", () => {
      const emojis = ["🩵","💙","🩷","💛","💖","💕","🤍","🖤","🌷","🌹","🪷","🌸","💗","💓","💞","🧡","💛","💚","💙","💜","🤍","🖤"];
      for(let i=0; i<50; i++){
        let e = document.createElement("div");
        e.classList.add("emoji");
        e.textContent = emojis[Math.floor(Math.random()*emojis.length)];
        e.style.left = "50%";
        e.style.top = "50%";
        e.style.setProperty("--x", (Math.random()*400-200) + "px");
        e.style.setProperty("--y", (Math.random()*400-200) + "px");
        document.body.appendChild(e);
        setTimeout(()=> e.remove(), 3000);
      }
    });
  </script>
</body>
</html>
