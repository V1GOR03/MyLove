<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️Made Just For You❤️</title>
<style>
body {
    background-color: #ffe6f0;
    font-family: Arial, sans-serif;
    margin:0; padding:0;
    overflow-x:hidden;
    position: relative;
}

/* القلوب والزهور المتحركة */
.background-item {
    position: absolute;
    width: 30px; height: 30px;
    animation: float 10s linear infinite;
    opacity: 0.8;
    pointer-events: none;
    z-index: 0;
}
.heart { background-color: #ff4b5c; clip-path: polygon(50% 0%, 61% 8%, 68% 23%, 68% 38%, 50% 60%, 32% 38%, 32% 23%, 39% 8%); }
.flower { background-color: #ffb6c1; border-radius: 50%; }

@keyframes float {
    0% { transform: translateY(-10%) scale(1); }
    50% { transform: translateY(50%) scale(1.2); }
    100% { transform: translateY(110%) scale(1); }
}

/* أقسام الصور والنصوص */
.section {
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 50px 20px;
    flex-wrap: wrap;
    gap: 30px;
}
.section:nth-child(even) { flex-direction: row-reverse; }

.section img {
    width: 250px; height: 250px;
    object-fit: cover;
    transition: transform 0.3s;
}
.section img:hover { transform: scale(1.1); }

.section .text {
    max-width: 400px;
    background: rgba(255,75,92,0.1);
    padding: 20px;
    border-radius: 15px;
}

/* نص صغير منفصل */
.small-text {
    max-width: 600px;
    margin: 30px auto;
    padding: 15px;
    border: 2px solid #ff4b5c;
    border-radius: 15px;
    text-align: center;
    font-size: 16px;
}

/* الأزرار التفاعلية */
.buttons {
    display: flex;
    justify-content: center;
    margin: 30px 0;
    gap: 20px;
}
.buttons button {
    padding: 12px 25px;
    font-size: 16px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    background-color: #ff4b5c;
    color: #fff;
    transition: background-color 0.3s;
}
.buttons button:hover { background-color: #ff1f3d; }

.response {
    text-align: center;
    font-size: 18px;
    margin-top: 20px;
    display: none;
}

/* زر الأغنية وزر القلوب */
.fixed-buttons {
    position: fixed;
    bottom: 20px;
    right: 20px;
    display: flex;
    gap: 15px;
    z-index: 1000;
}

/* زر الأغنية قلب */
.music-btn {
    width: 40px;
    height: 40px;
    background-color: #ff4b5c;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    transform: rotate(-45deg);
    transition: transform 0.3s, background-color 0.5s;
    position: relative;
}
.music-btn::before,
.music-btn::after {
    content: "";
    position: absolute;
    width: 40px;
    height: 40px;
    background-color: inherit;
    border-radius: 50%;
}
.music-btn::before { top: -20px; left: 0; }
.music-btn::after { left: 20px; top: 0; }
.music-btn.playing { animation: pulse 1s infinite; background-color: #ff1f3d; transform: rotate(-45deg) scale(1.2); }

@keyframes pulse {
    0% { transform: rotate(-45deg) scale(1); }
    50% { transform: rotate(-45deg) scale(1.3); }
    100% { transform: rotate(-45deg) scale(1); }
}

/* زر القلوب */
.emoji-btn {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    font-size: 22px;
    background-color: #ffb6c1;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s;
}
.emoji-btn:hover { transform: scale(1.1); }

/* الإيموجيز المتطايرة */
.flying-emoji {
    position: absolute;
    font-size: 2rem;
    animation: fly 3s linear forwards;
    pointer-events: none;
    z-index: 999;
}
@keyframes fly {
    0% { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(-200px) scale(1.5); opacity: 0; }
}
</style>
</head>
<body>

<!-- الخلفية -->
<div id="background"></div>

<!-- أقسام الصور والنصوص -->
<div class="section">
    <img src="images/photo1.jpg" alt="صورة 1">
    <div class="text">نص 1 بجانب الصورة</div>
</div>
<div class="section">
    <img src="images/photo2.jpg" alt="صورة 2">
    <div class="text">نص 2 بجانب الصورة</div>
</div>

<!-- نص صغير منفصل -->
<div class="small-text">هذا النص الصغير مع فريم أسفل الصور</div>

<!-- أزرار تفاعلية -->
<div class="buttons">
    <button id="btn1">اختيار 1</button>
    <button id="btn2">اختيار 2</button>
</div>
<div class="response" id="response"></div>

<!-- الأزرار الثابتة -->
<div class="fixed-buttons">
  <div class="music-btn" id="musicBtn"></div>
  <button class="emoji-btn" id="emojiBtn">💖</button>
</div>
<audio id="song" src="music/song.mp3"></audio>

<script>
// عمل القلوب والزهور بالخلفية
const colors = ['heart','flower'];
for(let i=0; i<30; i++){
    let item = document.createElement('div');
    item.classList.add('background-item', colors[Math.floor(Math.random()*colors.length)]);
    item.style.left = Math.random()*100+'vw';
    item.style.top = Math.random()*100+'vh';
    item.style.width = 15 + Math.random()*25+'px';
    item.style.height = item.style.width;
    item.style.animationDuration = 5 + Math.random()*5 + 's';
    document.body.appendChild(item);
}

// زر الأغنية
const musicBtn = document.getElementById('musicBtn');
const song = document.getElementById('song');
musicBtn.addEventListener('click', ()=>{
    if(song.paused){
        song.play();
        musicBtn.classList.add('playing');
    } else {
        song.pause();
        musicBtn.classList.remove('playing');
    }
});

// زر الإيموجيز
const emojiBtn = document.getElementById('emojiBtn');
const emojis = ["🩵","💙","🩷","💛","💖","💕","🤍"];

emojiBtn.addEventListener('click', () => {
  const emoji = document.createElement('div');
  emoji.classList.add('flying-emoji');
  emoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
  emoji.style.left = Math.random() * window.innerWidth + "px";
  emoji.style.top = (window.innerHeight - 50) + "px";

  document.body.appendChild(emoji);

  setTimeout(() => {
    emoji.remove();
  }, 3000);
});

// الأزرار التفاعلية
const btn1 = document.getElementById('btn1');
const btn2 = document.getElementById('btn2');
const response = document.getElementById('response');
btn1.addEventListener('click', ()=>{
    response.textContent = "لقد اخترت الاختيار 1";
    response.style.display = "block";
    btn2.style.display = "none";
});
btn2.addEventListener('click', ()=>{
    response.textContent = "لقد اخترت الاختيار 2";
    response.style.display = "block";
    btn1.style.display = "none";
});
</script>
</body>
</html>
