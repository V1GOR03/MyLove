<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>صفحة رومانسية</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      background: pink;
      font-family: Arial, sans-serif;
    }

    /* القلوب والزهور بالخلفية */
    .background-item {
      position: absolute;
      opacity: 0.8;
      z-index: 0;
    }

    @keyframes float {
      0% { transform: translateY(-10%) scale(1); }
      50% { transform: translateY(50%) scale(1.2); }
      100% { transform: translateY(110%) scale(1); }
    }

    /* شريط ثابت للأزرار */
    .fixed-buttons {
      position: fixed;
      top: 20px;
      left: 20px;
      display: flex;
      gap: 10px;
      z-index: 1000;
    }

    .music-btn, .emoji-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #ff4b5c;
      color: white;
      transition: transform 0.2s;
    }

    .music-btn.playing {
      background-color: #4CAF50;
    }

    .music-btn:hover, .emoji-btn:hover {
      transform: scale(1.1);
    }

    /* استجابة الأزرار */
    #response {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
      display: none;
    }

    /* الإيموجيز المتطايرة */
    .flying-emoji {
      position: absolute;
      font-size: 2rem;
      animation: fly 3s linear forwards;
      pointer-events: none;
      z-index: 999;
    }

    @keyframes fly {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-200px) scale(1.5); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- الأزرار الثابتة -->
  <div class="fixed-buttons">
    <button class="music-btn" id="musicBtn">🎵</button>
    <button class="emoji-btn" id="emojiBtn">💖</button>
  </div>

  <audio id="song" src="Somewhere Only We Know.mp3"></audio>

  <div style="margin:100px; font-size:22px;">
    <button id="btn1">اختيار 1</button>
    <button id="btn2">اختيار 2</button>
    <div id="response"></div>
  </div>

  <script>
    // إنشاء القلوب والزهور بالخلفية
    const colors = ['heart','flower'];
    for(let i=0; i<30; i++){
      let item = document.createElement('div');
      item.classList.add('background-item', colors[Math.floor(Math.random()*colors.length)]);
      item.style.left = Math.random()*100 + 'vw';
      item.style.top = Math.random()*100 + 'vh';
      item.style.width = 15 + Math.random()*25 + 'px';
      item.style.height = item.style.width;
      item.style.animation = `float ${5 + Math.random()*5}s linear infinite`;

      // قلب
      if(item.classList.contains('heart')){
          item.style.backgroundColor = '#ff4b5c';
          item.style.clipPath = 'polygon(50% 0%, 61% 8%, 68% 23%, 68% 38%, 50% 60%, 32% 38%, 32% 23%, 39% 8%)';
      }
      // زهرة
      if(item.classList.contains('flower')){
          item.style.backgroundColor = '#ffb6c1';
          item.style.borderRadius = '50%';
      }
      document.body.appendChild(item);
    }

    // زر الأغنية
    const musicBtn = document.getElementById('musicBtn');
    const song = document.getElementById('song');

    musicBtn.addEventListener('click', () => {
      if(song.paused){
          song.play();
          musicBtn.classList.add('playing');
      } else {
          song.pause();
          musicBtn.classList.remove('playing');
      }
    });

    // زر الإيموجيز
    const emojiBtn = document.getElementById('emojiBtn');
    const emojis = ["🩵","💙","🩷","💛","💖","💕","🤍"];

    emojiBtn.addEventListener('click', () => {
      const emoji = document.createElement('div');
      emoji.classList.add('flying-emoji');
      emoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      emoji.style.left = Math.random() * window.innerWidth + "px";
      emoji.style.top = (window.innerHeight - 50) + "px";

      document.body.appendChild(emoji);

      setTimeout(() => {
        emoji.remove();
      }, 3000);
    });

    // الأزرار التفاعلية
    const btn1 = document.getElementById('btn1');
    const btn2 = document.getElementById('btn2');
    const response = document.getElementById('response');

    btn1.addEventListener('click', () => {
      response.textContent = "لقد اخترت الاختيار 1";
      response.style.display = "block";
      btn2.style.display = "none";
    });

    btn2.addEventListener('click', () => {
      response.textContent = "لقد اخترت الاختيار 2";
      response.style.display = "block";
      btn1.style.display = "none";
    });
  </script>
</body>
</html>
