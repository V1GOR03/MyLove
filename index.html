<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صفحة القلوب</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background: #fce4ec;
    overflow-x: hidden;
    font-family: sans-serif;
    position: relative;
  }

  /* الخلفية: قلوب ملونة عشوائية */
  .heart {
    position: absolute;
    width: 20px;
    height: 20px;
    background-color: red;
    clip-path: polygon(50% 0%, 61% 12%, 75% 12%, 88% 25%, 88% 38%, 75% 50%, 50% 75%, 25% 50%, 12% 38%, 12% 25%, 25% 12%, 39% 12%);
    animation: float 6s linear infinite;
    opacity: 0.8;
  }

  @keyframes float {
    0% { transform: translateY(0) rotate(0deg);}
    100% { transform: translateY(-1000px) rotate(360deg);}
  }

  .image-container {
    display: inline-block;
    margin: 20px;
    position: relative;
    border: 3px solid #ff4081; /* فريم رفيع ملون */
    border-radius: 10px;
    overflow: hidden;
  }

  .image-container img {
    display: block;
    width: 200px;
    height: 200px;
    object-fit: cover;
  }

  /* قلب صغير فوق الصورة */
  .image-container .small-heart {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 25px;
    height: 25px;
    background-color: #ff1744;
    clip-path: polygon(50% 0%, 61% 12%, 75% 12%, 88% 25%, 88% 38%, 75% 50%, 50% 75%, 25% 50%, 12% 38%, 12% 25%, 25% 12%, 39% 12%);
    animation: beat 1s infinite;
  }

  @keyframes beat {
    0%, 100% { transform: scale(1);}
    50% { transform: scale(1.3);}
  }

  /* زر الأغنية */
  .music-button {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    width: 60px;
    height: 60px;
    background-color: #ff1744;
    clip-path: polygon(50% 0%, 61% 12%, 75% 12%, 88% 25%, 88% 38%, 75% 50%, 50% 75%, 25% 50%, 12% 38%, 12% 25%, 25% 12%, 39% 12%);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    animation: beat 1s infinite;
  }

  .music-button::after {
    content: '▶';
    color: white;
    font-size: 24px;
  }

</style>
</head>
<body>

<!-- صور تقدر تضيفها يدوي -->
<div class="image-container">
  <img src="رابط_صورتك_هنا.jpg" alt="صورة">
  <div class="small-heart"></div>
</div>

<div class="image-container">
  <img src="رابط_صورتك_هنا2.jpg" alt="صورة">
  <div class="small-heart"></div>
</div>

<!-- زر الأغنية -->
<div class="music-button"></div>

<script>
  // توليد قلوب عشوائية في الخلفية
  for(let i = 0; i < 30; i++){
    let heart = document.createElement('div');
    heart.classList.add('heart');
    heart.style.left = Math.random() * window.innerWidth + 'px';
    heart.style.animationDuration = (3 + Math.random() * 5) + 's';
    heart.style.backgroundColor = `hsl(${Math.random() * 360}, 80%, 60%)`;
    heart.style.width = (10 + Math.random() * 20) + 'px';
    heart.style.height = heart.style.width;
    document.body.appendChild(heart);
  }
</script>

</body>
</html>
