<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>For My Love 💖</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: white url('flowers-bg.png') repeat; /* صورة ورود خفيفة كخلفية */
      background-size: 200px;
      margin: 0;
      padding: 0;
      text-align: center;
      color: #444;
    }

    header {
      padding: 30px;
    }

    header h1 {
      color: #e75480;
      font-size: 2.5rem;
    }

    /* ستايل الصور */
    .gallery {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 20px auto;
      gap: 30px;
      max-width: 600px;
    }

    .photo-card {
      display: flex;
      align-items: center;
      gap: 15px;
      background: #fff;
      padding: 15px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 500px;
      transform: rotate(-2deg);
    }

    .photo-card:nth-child(even) {
      flex-direction: row-reverse;
      transform: rotate(2deg);
    }

    .photo-card img {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 15px;
      border: 3px solid #e75480;
    }

    /* الأزرار */
    .choices {
      margin: 40px 0;
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .choices button {
      padding: 12px 20px;
      border: none;
      border-radius: 25px;
      background-color: #e75480;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
    }

    .choices button:hover {
      background-color: #c44268;
    }

    .response {
      margin-top: 20px;
      font-size: 1.2rem;
      color: #444;
      font-weight: bold;
    }

    /* زر الأغنية */
    .heart-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      font-size: 2rem;
      color: gray;
      background: none;
      border: none;
      cursor: pointer;
      transition: color 0.3s;
    }

    .heart-btn.active {
      color: #e75480;
    }
  </style>
</head>
<body>

  <header>
    <h1>For My Love 💖</h1>
    <p>A little surprise with love and flowers 🌸</p>
  </header>

  <main>
    <div class="gallery">
      <div class="photo-card">
        <img src="ph1.jpg" alt="ph1.jpg">
        <p>نص صغير جنب الصورة الأولى 💕</p>
      </div>
      <div class="photo-card">
        <img src="img2.jpg" alt="Photo 2">
        <p>نص جنب الصورة الثانية 🌸</p>
      </div>
      <div class="photo-card">
        <img src="img3.jpg" alt="Photo 3">
        <p>نص جنب الصورة الثالثة 💖</p>
      </div>
      <div class="photo-card">
        <img src="img4.jpg" alt="Photo 4">
        <p>نص جنب الصورة الرابعة 🌹</p>
      </div>
      <div class="photo-card">
        <img src="img5.jpg" alt="Photo 5">
        <p>نص جنب الصورة الخامسة ✨</p>
      </div>
      <div class="photo-card">
        <img src="img6.jpg" alt="Photo 6">
        <p>نص جنب الصورة السادسة 🌼</p>
      </div>
      <div class="photo-card">
        <img src="img7.jpg" alt="Photo 7">
        <p>نص جنب الصورة السابعة 💜</p>
      </div>
      <div class="photo-card">
        <img src="img8.jpg" alt="Photo 8">
        <p>نص جنب الصورة الثامنة 🌷</p>
      </div>
      <div class="photo-card">
        <img src="img9.jpg" alt="Photo 9">
        <p>نص جنب الصورة التاسعة 🌟</p>
      </div>
    </div>

    <!-- الأزرار -->
    <div class="choices">
      <button onclick="showResponse(' اه بحبك 🌸')">بتحبيني؟</button>
      <button onclick="showResponse('ممم يعني بدي وقت 💕')">مش عارفه لسا</button>
    </div>

    <div class="response" id="response"></div>
  </main>

  <!-- زر القلب للأغنية -->
  <button class="heart-btn" id="heartBtn" onclick="toggleSong()">❤</button>

  <!-- الأغنية -->
  <audio id="mySong" loop>
    <source src="Somewhere Only We Know.mp3" type="audio/mpeg">
  </audio>

  <script>
    function showResponse(msg) {
      document.getElementById("response").innerText = msg;
    }

    function toggleSong() {
      const heart = document.getElementById("heartBtn");
      const song = document.getElementById("mySong");

      if (song.paused) {
        song.play();
        heart.classList.add("active");
      } else {
        song.pause();
        heart.classList.remove("active");
      }
    }
  </script>

</body>
</html>
