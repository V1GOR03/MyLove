<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>صفحة بالورود والقلوب</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: pink;
      overflow-x: hidden;
      font-family: sans-serif;
    }

    /* العناصر الخلفية */
    .background-item {
      position: absolute;
      opacity: 0.8;
      pointer-events: none;
    }

    /* أزرار ثابتة */
    .controls {
      position: fixed;
      bottom: 20px;
      left: 20px;
      display: flex;
      gap: 10px;
      z-index: 1000;
    }

    /* زر تشغيل الأغنية */
    #musicBtn {
      width: 40px;
      height: 40px;
      background-color: #ff4b5c;
      clip-path: polygon(50% 0%, 61% 8%, 68% 23%, 68% 38%, 50% 60%, 32% 38%, 32% 23%, 39% 8%);
      cursor: pointer;
      transition: transform 0.2s;
    }
    #musicBtn.playing {
      transform: scale(1.2);
    }

    /* زر إطلاق القلوب */
    #heartLauncher {
      width: 40px;
      height: 40px;
      background-color: beige;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    /* حركة العناصر */
    @keyframes float {
      0% { transform: translateY(-10%) scale(1); }
      50% { transform: translateY(50%) scale(1.2); }
      100% { transform: translateY(110%) scale(1); }
    }

    @keyframes fly {
      from { transform: translateY(0) scale(1); opacity: 1; }
      to { transform: translateY(-100vh) scale(1.5); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- الأزرار -->
  <div class="controls">
    <div id="musicBtn"></div>
    <div id="heartLauncher">💖</div>
  </div>

  <!-- ملف الصوت -->
  <audio id="song" src="Somewhere Only We Know.mp3"></audio>

  <script>
    // إنشاء قلوب وورود متحركة بالخلفية
    const colors = ['heart','flower'];
    for(let i=0; i<30; i++){
        let item = document.createElement('div');
        item.classList.add('background-item', colors[Math.floor(Math.random()*colors.length)]);
        item.style.left = Math.random()*100 + 'vw';
        item.style.top = Math.random()*100 + 'vh';
        item.style.width = 15 + Math.random()*25 + 'px';
        item.style.height = item.style.width;
        item.style.animation = `float ${5 + Math.random()*5}s linear infinite`;
        if(item.classList.contains('heart')){
            item.style.backgroundColor = '#ff4b5c';
            item.style.clipPath = 'polygon(50% 0%, 61% 8%, 68% 23%, 68% 38%, 50% 60%, 32% 38%, 32% 23%, 39% 8%)';
        } else {
            item.style.backgroundColor = '#ffb6c1';
            item.style.borderRadius = '50%';
        }
        document.body.appendChild(item);
    }

    // زر الأغنية
    const musicBtn = document.getElementById('musicBtn');
    const song = document.getElementById('song');
    musicBtn.addEventListener('click', () => {
        if(song.paused){
            song.play();
            musicBtn.classList.add('playing');
        } else {
            song.pause();
            musicBtn.classList.remove('playing');
        }
    });

    // زر إطلاق القلوب
    const heartLauncher = document.getElementById('heartLauncher');
    const emojis = ["🩵","💙","🩷","💛","💖","💕","🤍"];

    heartLauncher.addEventListener('click', () => {
      let heart = document.createElement('div');
      heart.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      heart.style.position = 'fixed';
      heart.style.left = (20 + Math.random()*60) + 'vw';
      heart.style.bottom = '20px';
      heart.style.fontSize = (20 + Math.random()*30) + 'px';
      heart.style.animation = 'fly 3s linear forwards';
      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 3000);
    });
  </script>

</body>
</html>
